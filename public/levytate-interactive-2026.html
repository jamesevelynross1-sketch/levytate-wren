/* Keep the skip link genuinely hidden until keyboard focus, including full-page capture. */
.skip-link:not(:focus){position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;top:0;left:0}.skip-link:focus{position:fixed;width:auto;height:auto;clip-path:none;overflow:visible;top:10px;padding:14px}

/* Final content-fit pass: retain the approved workspace, but never clip text or artwork. */
.workspace, .workspace-main, .workspace-canvas, .screen-body { min-width: 0; }
.screen-heading > div, .overview-grid > *, .workforce-result > *,
.investment-grid > *, .journey-detail > *, .before-after > *,
.provider-criteria > *, .evidence-result > *, .fit-result > *,
.provider-detail > *, .dialog-header > *, .criteria-list > div > strong,
.evidence-steps li > div { min-width: 0; }
h1, h2, h3, p, .answer-line strong, .criteria-list strong,
.workspace-identity strong { overflow-wrap: anywhere; }
.screen-heading h1, .provider-detail h2, .journey-explanation h2,
.detail-paper h2, .fit-result h2, .evidence-result h2 { max-width: 100%; text-wrap: pretty; }
.workforce-result { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.investment-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.journey-detail { grid-template-columns: minmax(0, .65fr) minmax(0, 1.8fr); }
.before-after, .fit-result { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.provider-criteria { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
.evidence-result { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.provider-detail { grid-template-columns: minmax(54px, .35fr) minmax(0, 1.65fr); }
.brand-home { min-height: 80px; height: auto; padding-block: 12px; }
.brand { display: inline-grid; grid-template-columns: 27px minmax(0, 1fr); align-items: center; gap: 7px; width: 174px; max-width: 100%; min-width: 0; overflow: visible; }
.brand img { display: block; height: auto; object-fit: contain; object-position: center; max-width: 100%; }
.brand img:first-child { width: 27px; }
.brand img:last-child { width: 100%; }
.brand-compact { width: 166px; grid-template-columns: 25px minmax(0, 1fr); }
.brand-compact img:first-child { width: 25px; }
.brand-compact img:last-child { width: 100%; }
.identity-avatar { flex: 0 0 35px; }
.workspace-identity > div { min-width: 0; }
.workspace-identity strong { line-height: 1.4; }
.workspace-identity div > span { line-height: 1.45; }
.area-picker { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 17px 24px; border-bottom: 1px solid var(--line); background: #fcfdfb; }
.area-picker label { font-size: 12px; color: var(--muted); }
.area-picker select { min-height: 44px; width: min(270px, 100%); border: 1px solid #a8bfb1; border-radius: 5px; background: white; color: var(--ink); font-size: 13px; padding: 10px 36px 10px 13px; cursor: pointer; }
.area-picker select:focus-visible { outline: 3px solid #237b78; outline-offset: 3px; }
.area-picker > span { margin-left: auto; font-size: 10px; color: var(--muted); }
.option-row { flex-wrap: wrap; overflow: visible; gap: 0 12px; }
.option { white-space: normal; line-height: 1.45; min-width: 0; min-height: 51px; justify-content: center; flex: 1 1 auto; }
.option-number { flex: 0 0 auto; }
.explorer-panel { min-width: 0; }
.button-primary { max-width: 100%; text-align: center; line-height: 1.45; }
.button-primary > span[aria-hidden] { flex: 0 0 auto; }
.provider-detail .answer-line { max-width: 100%; }
.detail-paper .answer-line strong { font-size: 14px; }
.evidence-steps li > span { flex: 0 0 16px; }
.panel-top { flex-wrap: wrap; }
.sidebar-status { line-height: 1.5; }
.email-fallback { flex-wrap: wrap; gap: 8px 14px; }
.email-fallback a { overflow-wrap: anywhere; }
