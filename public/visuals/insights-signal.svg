<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Apprenticeship market intelligence signals</title>
  <desc id="desc">A minimal market intelligence architecture showing policy, providers, AI capability and employer demand.</desc>
  <rect width="720" height="360" rx="28" fill="#F7F2E8"/>
  <rect x="46" y="42" width="628" height="276" rx="24" fill="#15392F"/>
  <text x="88" y="90" fill="#2C8C83" font-family="Aptos, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.4">MARKET INTELLIGENCE</text>
  <g font-family="Aptos, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".7">
    <rect x="88" y="122" width="244" height="56" rx="14" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".15"/>
    <text x="112" y="156" fill="#F7F2E8">POLICY SIGNALS</text>
    <circle cx="302" cy="150" r="5" fill="#2C8C83"/>
    <rect x="388" y="122" width="244" height="56" rx="14" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".15"/>
    <text x="412" y="156" fill="#F7F2E8">PROVIDER MOVEMENT</text>
    <circle cx="602" cy="150" r="5" fill="#2C8C83"/>
    <rect x="88" y="210" width="244" height="56" rx="14" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".15"/>
    <text x="112" y="244" fill="#F7F2E8">AI CAPABILITY</text>
    <circle cx="302" cy="238" r="5" fill="#2C8C83"/>
    <rect x="388" y="210" width="244" height="56" rx="14" fill="#2C8C83" fill-opacity=".14" stroke="#2C8C83" stroke-opacity=".64"/>
    <text x="412" y="244" fill="#F7F2E8">EMPLOYER DEMAND</text>
    <circle cx="602" cy="238" r="5" fill="#F7F2E8" fill-opacity=".82"/>
  </g>
</svg>
