<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Strategic apprenticeship operating model</title>
  <desc id="desc">A minimal framework showing workforce need, pathways, provider fit and workforce impact.</desc>
  <rect width="720" height="440" rx="28" fill="#15392F"/>
  <rect x="86" y="66" width="548" height="308" rx="26" fill="#F7F2E8" fill-opacity=".055" stroke="#F7F2E8" stroke-opacity=".14"/>
  <text x="120" y="112" fill="#2C8C83" font-family="Aptos, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2.6">OPERATING MODEL</text>
  <g font-family="Aptos, Arial, sans-serif">
    <rect x="136" y="142" width="448" height="46" rx="12" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".16"/>
    <text x="360" y="171" text-anchor="middle" fill="#F7F2E8" font-size="14" font-weight="800" letter-spacing=".8">WORKFORCE NEED</text>
    <path d="M360 198v18" stroke="#2C8C83" stroke-width="2" stroke-linecap="round"/>
    <rect x="136" y="226" width="448" height="46" rx="12" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".16"/>
    <text x="360" y="255" text-anchor="middle" fill="#F7F2E8" font-size="14" font-weight="800" letter-spacing=".8">PATHWAYS</text>
    <path d="M360 282v18" stroke="#2C8C83" stroke-width="2" stroke-linecap="round"/>
    <rect x="136" y="310" width="206" height="46" rx="12" fill="#F7F2E8" fill-opacity=".08" stroke="#F7F2E8" stroke-opacity=".16"/>
    <text x="239" y="339" text-anchor="middle" fill="#F7F2E8" font-size="14" font-weight="800" letter-spacing=".8">PROVIDER FIT</text>
    <rect x="378" y="310" width="206" height="46" rx="12" fill="#2C8C83" fill-opacity=".16" stroke="#2C8C83" stroke-opacity=".7"/>
    <text x="481" y="339" text-anchor="middle" fill="#F7F2E8" font-size="14" font-weight="800" letter-spacing=".8">WORKFORCE IMPACT</text>
  </g>
</svg>
